name: Build XBTC Exchange APK
on:
  push:
    branches: [android-xbtc-apk]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Prepare exchange assets
        run: |
          mkdir -p android/app/src/main/assets
          cp exchange/index.html android/app/src/main/assets/index.html
      - name: Build APK
        run: gradle -p android assembleDebug --no-daemon
      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose android/app/build/outputs/apk/debug/app-debug.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk XBTC-Exchange.apk
          sha256sum XBTC-Exchange.apk > XBTC-Exchange.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: XBTC-Exchange-APK
          path: |
            XBTC-Exchange.apk
            XBTC-Exchange.apk.sha256
          if-no-files-found: error
